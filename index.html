<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Social Season's Greatest Question</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Great+Vibes&display=swap');

        :root {
            --bg-color: #fcf8f0;
            --bridgerton-blue: #7ba7bc;
            --gold: #c5a059;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Playfair Display', serif;
            background-color: var(--bg-color);
            transition: background-color 0.8s ease;
            overflow: hidden;
            color: #333;
        }

        /* Full Screen Whistledown Curtain */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fdfaf5;
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000; /* Higher than everything else */
            cursor: pointer;
            border: 15px double var(--gold);
            box-sizing: border-box;
            text-align: center;
            padding: 20px;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #start-overlay h2 {
            font-family: 'Great Vibes', cursive;
            color: var(--gold);
            font-size: 3.5rem;
            margin-bottom: 0;
        }

        /* Container starts HIDDEN */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 3rem;
            border: 2px solid var(--gold);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 90%;
            position: relative;
            opacity: 0; /* Hidden initially */
            transform: translateY(20px);
            transition: opacity 1s ease, transform 1s ease;
        }

        /* Class to show the container later */
        .container.reveal {
            opacity: 1;
            transform: translateY(0);
        }

        #display-image {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border: 4px solid var(--bridgerton-blue);
            margin-bottom: 20px;
        }

        h1 {
            color: #2c3e50;
            font-size: 1.6rem;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 12px 25px;
            font-family: 'Playfair Display', serif;
            font-weight: bold;
            text-transform: uppercase;
            border: 1px solid rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #yes-btn { background-color: var(--bridgerton-blue); color: white; z-index: 10; }
        #no-btn { background-color: #e74c3c; color: white; }

        .hidden { display: none !important; }

        .rose {
            position: absolute;
            top: -50px;
            font-size: 2rem;
            user-select: none;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <h2>Dearest Gentle Reader...</h2>
        <p style="font-style: italic; font-size: 1.4rem; max-width: 500px;">
            The ton is abuzz with the latest gossip. It seems one particular member of society has a question of the utmost importance...
        </p>
        <p style="margin-top: 30px; font-size: 0.8rem; color: var(--gold); letter-spacing: 2px;">TAP TO UNCOVER THE SCANDAL</p>
    </div>

    <div class="container" id="main-container">
        <img id="display-image" src="./image/catFlower.png" alt="Valentine Image">
        <h1 id="question-text">Will you do me the honor of being my Valentine?</h1>
        
        <div class="buttons">
            <button id="yes-btn">I Shall</button>
            <button id="no-btn">I Decline</button>
        </div>
    </div>

    <audio id="audio-player"></audio>

    <script>
        let stage = 1;
        let yesScale = 1;

        const imgElement = document.getElementById('display-image');
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        const audioPlayer = document.getElementById('audio-player');
        const overlay = document.getElementById('start-overlay');
        const container = document.getElementById('main-container');

        const stages = {
            1: { img: './image/catFlower.png', audio: './audio/whisle.mp3', bg: '#fcf8f0' }, 
            2: { img: './image/sadCat.png', audio: './audio/crying.mp3', bg: '#dfe6e9' }, 
            3: { img: './image/catGun.png', audio: './audio/Gun.mp3', bg: '#b2bec3' }, 
            4: { img: './image/catGunMe.png', audio: './audio/GunMe.mp3', bg: '#636e72' }, 
            5: { img: './image/happyCat.png', audio: './audio/Happy.mp3', bg: '#7ba7bc' }
        };

        // Click to Reveal Logic
        overlay.addEventListener('click', () => {
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                container.classList.add('reveal'); // Reveal the cat and question
                updateStage(1);
            }, 800);
        });

        function createRose() {
            const rose = document.createElement('div');
            rose.classList.add('rose');
            rose.innerText = '🌹'; 
            rose.style.left = Math.random() * 100 + 'vw';
            rose.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(rose);
            setTimeout(() => rose.remove(), 5000);
        }

        function updateStage(s) {
            stage = s;
            imgElement.src = stages[s].img;
            audioPlayer.src = stages[s].audio;
            audioPlayer.load();
            audioPlayer.play().catch(e => console.log("Audio play blocked"));
            document.body.style.backgroundColor = stages[s].bg;

            if (s === 4) { noBtn.classList.add('hidden'); }
            if (s === 5) {
                noBtn.classList.add('hidden');
                yesBtn.classList.add('hidden');
                document.getElementById('question-text').innerHTML = "A Match Made in Heaven!<br>Truly the Diamond of the Season. ❤️";
                setInterval(createRose, 150);
            }
        }

        noBtn.addEventListener('click', () => {
            if (stage < 4) {
                stage++;
                yesScale += 0.6;
                yesBtn.style.transform = `scale(${yesScale})`;
                const texts = ["Will you be my Valentine?", "Surely you jest?", "My heart is wounded!", "Is there no mercy?"];
                document.getElementById('question-text').innerText = texts[stage-1];
                updateStage(stage);
            }
        });

        yesBtn.addEventListener('click', () => updateStage(5));
    </script>
</body>
</html>
